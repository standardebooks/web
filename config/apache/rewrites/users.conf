# Since we can receive a URL like `/users/:user-identifier`, we have to white list these URLs first.
RewriteCond	%{REQUEST_FILENAME} !^/users/new\.php$
RewriteCond	%{REQUEST_FILENAME} !^/users/index\.php$
RewriteCond	%{REQUEST_FILENAME} !^/users/get$
RewriteRule	^/users/([^/]+)$				/users/http-router.php?user-identifier=$1 [B,QSA]

# Route requests to jump to a `User` from the `Users`s index.
RewriteRule	^/users/get$					/users/http-router.php [QSA]

# Route requests to disambiguate several `User`s.
RewriteRule	^/users/([^/]+)/disambiguation$			/users/disambiguation.php?user-identifier=$1 [B]

# Route requests for forms applying to a specific resource.
RewriteRule	^/users/([^/]+)/(delete|edit)$			/users/$2.php?user-identifier=$1 [B]

# Route requests for creating a `Patron` for a `User`.
RewriteRule	^/users/([^/]+)/patrons$			/patrons/http-router.php?user-identifier=$1 [B]
RewriteRule	^/users/([^/]+)/patrons/new$			/patrons/new.php?user-identifier=$1 [B]

# Route requests for `Projects` for a `User`.
RewriteRule	^/users/([^/]+)/projects$			/users/projects/index.php?user-identifier=$1 [B]

# Route session login links sent by email.
RewriteRule	^/users/([^/]+)/session-login-codes/([a-z0-9\-]+)$	/session-login-codes/http-router.php?user-identifier=$1&session-login-code=$2 [B,QSA]

# Route requests to manage a `User`'s `Subscription`s.
RewriteRule	^/users/([^/]+)/subscriptions/([0-9]+)/(delete|edit)$	/subscriptions/$3.php?user-identifier=$1&subscription-id=$2 [B]
RewriteRule	^/users/([^/]+)/subscriptions/([0-9]+)$			/subscriptions/http-router.php?user-identifier=$1&subscription-id=$2 [B]
