# Redirect old feed URLs.
RewriteRule	^/(opds|rss|atom)(.*)$				/feeds/$1$2 [R=301]
RewriteCond	%{REQUEST_URI}	^/feeds/rss(.*)$
RewriteRule	^					/feeds/atom%1 [R=301,L]

# Rewrite search pages for feeds.
RewriteCond	%{QUERY_STRING}	\bquery=
RewriteRule	^/feeds/(opds|atom)/all\.xml$			/feeds/search.php?feed-format-type=$1 [QSA]

RewriteRule	^/feeds/atom/([a-z0-9\-]+)$			/feeds/collection.php?feed-format=atom&collection-type=$1

RewriteRule 	^/feeds/([^\s]+\.xml)$				/feeds/download.php?path=$1
